<html lang="en">

<head>

    rel="stylesheet">
  <style>
    /* ===========================
   Global Variables
   =========================== */
    :root {
      --ink-dark: #0d0d0f;
      --ink-dark-2: #1c1c20;
      --gold: #c9a24c;
      --gold-press: #a8842e;
      --bg: #f1f1f3;
      --card: #ffffff;
      --ink: #16171a;
      --muted: #6b7078;
      --line: #e1e2e5;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    /* ===========================
   Header
   =========================== */
    header {
      background: var(--ink-dark);
      color: #fff;
      padding: 14px 16px 16px;
    }

    .head-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .head-top img {
      height: 44px;
      width: auto;
      display: block;
      border-radius: 6px;
    }

    .head-top .co {
      font-size: .72rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #a9adb3;
      font-weight: 500;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      margin-top: 14px;
      letter-spacing: -.01em;
      line-height: 1.05;
    }

    h1 .bar {
      display: inline-block;
      width: 34px;
      height: 4px;
      background: var(--gold);
      border-radius: 2px;
      vertical-align: middle;
      margin-right: 10px;
    }

    .sub {
      color: #a9adb3;
      font-size: .82rem;
      margin-top: 6px;
    }

    /* ===========================
   Sticky Controls
   =========================== */
    .controls {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--ink-dark-2);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      padding: 10px 0 11px;
    }

    .groups {
      display: flex;
      gap: 8px;
      padding: 0 16px 10px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .groups::-webkit-scrollbar {
      display: none;
    }

    .group-btn {
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, .18);
      background: transparent;
      color: #cfd2d7;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: .86rem;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      line-height: 1.15;
      white-space: nowrap;
      text-align: left;
      transition: background .15s, color .15s, border-color .15s;
    }

    .group-btn .gn {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: .68rem;
      opacity: .65;
      margin-top: 3px;
    }

    .group-btn:hover {
      border-color: rgba(255, 255, 255, .4);
      color: #fff;
    }

    .group-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #141414;
    }

    .group-btn.active .gn {
      opacity: .75;
    }

    .chip-rail {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 16px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .chip-rail::-webkit-scrollbar {
      display: none;
    }

    .chip-rail.hidden {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, .18);
      background: transparent;
      color: #cfd2d7;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      font-size: .82rem;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s, border-color .15s;
    }

    .chip .n {
      font-family: 'JetBrains Mono', monospace;
      font-size: .72rem;
      opacity: .7;
      margin-left: 6px;
    }

    .chip:hover {
      border-color: rgba(255, 255, 255, .4);
      color: #fff;
    }

    .chip.active {
      background: #fff;
      border-color: #fff;
      color: var(--ink-dark);
    }

    .chip.active .n {
      opacity: .6;
    }

    /* ===========================
   Section Meta & Search
   =========================== */
    .meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 18px 16px 10px;
    }

    .meta h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: -.01em;
    }

    .meta .count {
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .search-wrap {
      padding: 0 16px;
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font-family: inherit;
      font-size: .92rem;
      padding: 11px 14px;
      outline: none;
    }

    .search::placeholder {
      color: #9aa0a8;
    }

    .search:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 162, 76, .18);
    }

    /* ===========================
   Grid
   =========================== */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 14px 16px 40px;
    }

    @media(min-width: 480px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media(min-width: 760px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media(min-width: 1080px) {
      .grid {
        grid-template-columns: repeat(5, 1fr);
        max-width: 1280px;
        margin: 0 auto;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(13, 13, 15, .13);
      border-color: #c7c8cc;
    }

    .card:active {
      transform: translateY(0);
    }

    .thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 1/1;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .thumb img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .thumb .fallback {
      display: none;
      color: var(--muted);
      font-size: .72rem;
      text-align: center;
      padding: 0 8px;
    }

    .thumb.err img {
      display: none;
    }

    .thumb.err .fallback {
      display: block;
    }

    .thumb.placeholder {
      background: repeating-linear-gradient(135deg, #f5f5f6, #f5f5f6 10px, #eeeeef 10px, #eeeeef 20px);
      flex-direction: column;
      gap: 6px;
    }

    .thumb.placeholder .ph-icon {
      font-size: 1.6rem;
      opacity: .35;
    }

    .thumb.placeholder .ph-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: .62rem;
      color: #9aa0a8;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .cap {
      border-top: 1px solid var(--line);
      padding: 9px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: .72rem;
      color: var(--ink);
      word-break: break-word;
      line-height: 1.3;
      min-height: 38px;
      display: flex;
      align-items: center;
    }

    .card-cat {
      padding: 6px 10px 9px;
      font-family: 'Inter', sans-serif;
      font-size: .62rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      line-height: 1.3;
    }

    .empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
    }

    /* ===========================
   Lightbox
   =========================== */
    .lb {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      background: rgba(10, 10, 12, .92);
      align-items: center;
      justify-content: center;
      padding: 18px;
      backdrop-filter: blur(2px);
    }

    .lb.open {
      display: flex;
    }

    .lb-inner {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .lb-stage {
      width: 100%;
      background: #fff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      min-height: 240px;
      max-height: 70vh;
    }

    .lb-stage img {
      max-width: 100%;
      max-height: 64vh;
      object-fit: contain;
      display: block;
    }

    .lb-stage .ph-icon {
      font-size: 3rem;
      opacity: .3;
    }

    .lb-stage .ph-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      color: #9aa0a8;
      margin-top: 8px;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .lb-stage.placeholder {
      flex-direction: column;
      background: repeating-linear-gradient(135deg, #f5f5f6, #f5f5f6 10px, #eeeeef 10px, #eeeeef 20px);
    }

    .lb-cap {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: #fff;
      font-size: .92rem;
      text-align: center;
      word-break: break-word;
    }

    .lb-cat {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      color: #a9adb3;
      font-size: .74rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      display: block;
      margin-bottom: 5px;
    }

    .lb-counter {
      font-family: 'JetBrains Mono', monospace;
      color: #a9adb3;
      font-size: .76rem;
    }

    .lb-enquire {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 2px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: .92rem;
      padding: 12px 22px;
      border-radius: 999px;
      cursor: pointer;
      transition: background .15s, transform .12s;
    }

    .lb-enquire:hover {
      background: #1ebe57;
    }

    .lb-enquire:active {
      transform: translateY(1px);
    }

    .lb-enquire svg {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .lb-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: rgba(255, 255, 255, .12);
      color: #fff;
      font-size: 1.4rem;
      line-height: 1;
    }

    .lb-close:hover {
      background: var(--gold);
      color: #141414;
    }

    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: rgba(255, 255, 255, .12);
      color: #fff;
      font-size: 1.5rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lb-nav:hover {
      background: var(--gold);
      color: #141414;
    }

    .lb-prev {
      left: 10px;
    }

    .lb-next {
      right: 10px;
    }

    @media(min-width: 700px) {
      .lb-prev {
        left: 24px;
      }

      .lb-next {
        right: 24px;
      }
    }

    /* ===========================
   Logo Slider
   =========================== */
    .logo-slider {
      background: #ffffff;
      padding: 30px 0;
      overflow: hidden;
      border-top: 1px solid var(--line);
      position: relative;
      width: 100%;
      display: flex;
    }

    .logo-slider::before,
    .logo-slider::after {
      content: "";
      position: absolute;
      top: 0;
      width: 60px;
      height: 100%;
      z-index: 2;
    }

    .logo-slider::before {
      left: 0;
      background: linear-gradient(to right, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 100%);
    }

    .logo-slider::after {
      right: 0;
      background: linear-gradient(to left, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 100%);
    }

    .logo-slide-track {
      display: flex;
      width: max-content;
      animation: scroll 30s linear infinite;
      align-items: center;
      gap: 60px;
      padding: 0 30px;
    }

    .logo-slide-track img {
      height: 70px;
      width: auto;
      max-width: 220px;
      object-fit: contain;
      flex-shrink: 0;
    }

    @keyframes scroll {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(calc(-50% - 30px));
      }
    }

    /* ===========================
   Footer
   =========================== */
    footer {
      background: var(--ink-dark);
      color: #a9adb3;
      padding: 22px 16px;
      font-size: .78rem;
      text-align: center;
      line-height: 1.7;
    }

    footer a {
      color: var(--gold);
      text-decoration: none;
    }

    footer .name {
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: .92rem;
    }

    @media(prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

            { name: "PILOT LIGHT JG-AD116-D1-YELLOW", image: "din-mount6.png" },
          ],
          "cam-switches": [
            { name: "LW30-20 3P", image: "cam1.png" },
            { name: "LW30-63 3P", image: "cam2.png" },
            { name: "LW30-63 4P", image: "cam3.png" },
            { name: "LW40-63 3P", image: "cam4.png" },

          ],
          "metal-push-button": [
            { name: "16MM 24V G LATCHING", image: "metal button 1.png" },
            { name: "16MM 24V G SPRING RETURN", image: "metal button2.png" },
            { name: "19MM 220V G LATCHING", image: "metal button3.png" },
            { name: "19MM 220V G SPRING RETURN", image: "metal button4.png" },
            { name: "22MM 24V G LATCHING", image: "metal button5.png" },
            { name: "22MM 24V G SPRING RETURN", image: "metal button6.png" },
          ],
          "neutral-links": [
            { name: "6 WAY-0609", image: "neutral1.png" },
            { name: "8 WAY-0609", image: "neutral2.png" },
            { name: "12 WAY-0609", image: "neutral3.png" },
            { name: "16 WAY-0609", image: "neutral4.png" },
            { name: "18 WAY-0609", image: "neutral5.png" },
            { name: "20 WAY-0609", image: "neutral6.png" },
          ],
          "window-hoods": [
            { name: "JG-2 POLE", image: "neutral1.jpg" },
            { name: "JG-3 POLE", image: "neutral2.jpg" },
            { name: "JG-4 POLE", image: "neutral3.jpg" },
            { name: "JG-6 POLE", image: "neutral4.jpg" },
            { name: "JG-8 POLE", image: "neutral5.jpg" },
            { name: "JG-10 POLE", image: "neutral6.jpg" },
          ],
        }
      }
    };


    const GROUP_ORDER = Object.keys(GROUPS);

    /* Har product object { name, image } ko grid ke liye ready karta hai */
    GROUP_ORDER.forEach(gk => {
      const g = GROUPS[gk];
      g.order = Object.keys(g.labels);
      g.cat = {};
      g.total = 0;
      g.order.forEach(k => {
        g.cat[k] = (g.data[k] || []).map(p => {
          return { img: resolveImagePath(p.image), name: p.name, gk: gk, k: k, groupLabel: g.label, catLabel: g.labels[k] };
        });
        g.total += g.cat[k].length;
      });
    });

    /* Flat index of every product, used for global (all-category) search */
    const ALL_ITEMS = [];
    GROUP_ORDER.forEach(gk => {
      const g = GROUPS[gk];
      g.order.forEach(k => g.cat[k].forEach(it => ALL_ITEMS.push(it)));
    });

    let activeGroup = GROUP_ORDER[0];
    let activeKey = GROUPS[activeGroup].order[0];
    let viewItems = [];
    let lbIndex = 0;

    const groupsEl = document.getElementById("groups");
    const chipRail = document.getElementById("chipRail");
    const groupTitle = document.getElementById("groupTitle");
    const catTitle = document.getElementById("catTitle");
    const catCount = document.getElementById("catCount");
    const searchEl = document.getElementById("search");
    const grid = document.getElementById("grid");

    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    /* ---- Group toggle ---- */
    function buildGroups() {
      groupsEl.innerHTML = "";
      GROUP_ORDER.forEach(gk => {
        const g = GROUPS[gk];
        const b = document.createElement("button");
        b.className = "group-btn" + (gk === activeGroup ? " active" : "");
        b.dataset.gk = gk;
        b.innerHTML = g.label + '<span class="gn">' + g.total + ' products</span>';
        b.onclick = () => {
          activeGroup = gk;
          activeKey = g.order[0];
          searchEl.value = "";
          buildGroups();
          buildChips();
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        groupsEl.appendChild(b);
      });
    }

    /* ---- Subcategory chips ---- */
    function buildChips() {
      const g = GROUPS[activeGroup];
      chipRail.innerHTML = "";
      chipRail.classList.toggle("hidden", g.order.length <= 1);
      g.order.forEach(k => {
        const b = document.createElement("button");
        b.className = "chip" + (k === activeKey ? " active" : "");
        b.dataset.k = k;
        b.innerHTML = g.labels[k] + '<span class="n">' + g.cat[k].length + '</span>';
        b.onclick = () => {
          activeKey = k; searchEl.value = ""; render();
          b.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
        };
        chipRail.appendChild(b);
      });
      chipRail.scrollLeft = 0;
    }

    /* ---- Grid render ---- */
    function render() {
      const g = GROUPS[activeGroup];
      const q = searchEl.value.trim().toLowerCase();

      let items;
      if (q) {
        /* Global search across every group and category */
        items = ALL_ITEMS.filter(it => it.name.toLowerCase().includes(q));
        groupTitle.textContent = "Search Results";
        catTitle.textContent = 'Results for "' + searchEl.value.trim() + '"';
        [...chipRail.children].forEach(c => c.classList.remove("active"));
      } else {
        items = g.cat[activeKey];
        groupTitle.textContent = g.label;
        catTitle.textContent = g.labels[activeKey];
        [...chipRail.children].forEach(c => c.classList.toggle("active", c.dataset.k === activeKey));
      }
      viewItems = items;

      catCount.textContent = items.length + (items.length === 1 ? " item" : " items");
      grid.innerHTML = "";

      if (items.length === 0) {
        const e = document.createElement("div");
        e.className = "empty";
        e.textContent = q ? 'No products match "' + searchEl.value + '" anywhere in the catalogue.' : "No products in this series yet.";
        grid.appendChild(e);
        return;
      }

      items.forEach((it, idx) => {
        const card = document.createElement("div");
        card.className = "card";
        const tag = q ? '<div class="card-cat">' + esc(it.groupLabel) + ' · ' + esc(it.catLabel) + '</div>' : '';
        const thumbHtml = it.img
          ? '<div class="thumb"><img loading="lazy" src="' + it.img + '" alt="' + esc(it.name) + '"><span class="fallback">No Image Available</span></div>'
          : '<div class="thumb placeholder"><span class="ph-icon">&#128247;</span><span class="ph-text">No Image Available</span></div>';
        card.innerHTML = thumbHtml + '<div class="cap">' + esc(it.name) + '</div>' + tag;
        const thumb = card.querySelector(".thumb");
        const img = card.querySelector("img");
        if (img) img.addEventListener("error", () => thumb.classList.add("err"));
        card.onclick = () => openLightbox(idx);
        grid.appendChild(card);
      });
    }

    /* ---- Lightbox ---- */
    const lb = document.getElementById("lightbox");
    const lbStage = document.getElementById("lbStage");
    const lbImg = document.getElementById("lbImg");
    const lbName = document.getElementById("lbName");
    const lbCat = document.getElementById("lbCat");
    const lbCounter = document.getElementById("lbCounter");
    const lbEnquire = document.getElementById("lbEnquire");

    function openLightbox(i) { lbIndex = i; showLb(); lb.classList.add("open"); document.body.style.overflow = "hidden"; }
    function showLb() {
      const it = viewItems[lbIndex]; if (!it) return;
      if (it.img) {
        lbStage.classList.remove("placeholder");
        lbStage.innerHTML = '<img id="lbImg" src="' + it.img + '" alt="' + esc(it.name) + '">';
      } else {
        lbStage.classList.add("placeholder");
        lbStage.innerHTML = '<span class="ph-icon">&#128247;</span><span class="ph-text">No Image Available</span>';
      }
      lbName.textContent = it.name;
      lbCat.textContent = it.groupLabel + " · " + it.catLabel;
      lbCounter.textContent = (lbIndex + 1) + " / " + viewItems.length;
      const msg = "Hi RD Enterprises, I'd like the price and availability for:\n"
        + it.name + " (" + it.groupLabel + " \u203A " + it.catLabel + ")";
      lbEnquire.href = "https://wa.me/917494990354?text=" + encodeURIComponent(msg);
    }
    function closeLightbox() { lb.classList.remove("open"); document.body.style.overflow = ""; }
    function navLb(d) { lbIndex = (lbIndex + d + viewItems.length) % viewItems.length; showLb(); }

    document.getElementById("lbClose").onclick = closeLightbox;
    document.getElementById("lbPrev").onclick = () => navLb(-1);
    document.getElementById("lbNext").onclick = () => navLb(1);
    lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });
    document.addEventListener("keydown", e => {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") navLb(-1);
      if (e.key === "ArrowRight") navLb(1);
    });
    let touchX = null;
    lb.addEventListener("touchstart", e => { touchX = e.changedTouches[0].clientX; }, { passive: true });
    lb.addEventListener("touchend", e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 45) navLb(dx < 0 ? 1 : -1);
      touchX = null;
    }, { passive: true });

    searchEl.addEventListener("input", render);

    /* ---- Init ---- */
    buildGroups();
    buildChips();
    render();

  </script>
</body>

</html>
